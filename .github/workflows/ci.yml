name: CI

# Manual only — automatic push/PR runs were flooding failure emails across
# live / origin / production remotes. Re-enable push triggers when CI is green.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
